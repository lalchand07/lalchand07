<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Lal Chand, I build the systems and automations a business runs on" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050f5c"/>
      <stop offset="55%" stop-color="#030d4e"/>
      <stop offset="100%" stop-color="#020933"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12a17a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#12a17a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12a17a"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#12a17a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle cx="152" cy="140" r="150" fill="url(#glow)"/>

    <!-- light sweeping across the panel -->
    <rect width="260" height="280" fill="url(#sweep)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="-300,0; 1100,0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- the mark: concentric arcs with an orbiting node -->
    <g transform="translate(152 140)">
      <circle r="62" fill="none" stroke="#12a17a" stroke-opacity="0.16" stroke-width="1.5"/>

      <circle r="46" fill="none" stroke="#12a17a" stroke-width="3.5"
              stroke-linecap="round" stroke-dasharray="216 289" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>

      <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5"
              stroke-linecap="round" stroke-dasharray="120 68">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="9s" repeatCount="indefinite"/>
      </circle>

      <circle r="9" fill="#12a17a">
        <animate attributeName="r" values="9;11;9" dur="2.6s" repeatCount="indefinite"/>
      </circle>

      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="6.5s" repeatCount="indefinite"/>
        <circle cx="46" cy="0" r="5.5" fill="#ffffff" opacity="0.95"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="180" to="540" dur="10s" repeatCount="indefinite"/>
        <circle cx="62" cy="0" r="3.5" fill="#12a17a"/>
      </g>
    </g>

    <!-- type -->
    <g transform="translate(268 0)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="0" y="88" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-1" opacity="0">
        Lal Chand
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.1s" fill="freeze"/>
      </text>

      <rect x="2" y="104" width="0" height="3" fill="url(#rule)">
        <animate attributeName="width" values="0;330" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>

      <text x="0" y="140" fill="#c3cbe0" font-size="19" font-weight="400" opacity="0">
        I build the systems and automations a business runs on.
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.8s" fill="freeze"/>
      </text>

      <!-- rotating specialism line -->
      <g font-size="16.5" font-weight="600" fill="#12a17a">
        <text x="0" y="176" opacity="0">
          AI agents · Workflow automation · n8n · Claude API
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0"
                   dur="12s" begin="1.4s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="176" opacity="0">
          Booking platforms · Operations software · Back-office systems
          <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0"
                   dur="12s" begin="1.4s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="176" opacity="0">
          Integrations · WhatsApp Business API · Legacy rescue
          <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0"
                   dur="12s" begin="1.4s" repeatCount="indefinite"/>
        </text>
      </g>

      <text x="0" y="215" fill="#7e8aab" font-size="14" font-weight="400" letter-spacing="0.4" opacity="0">
        Islamabad, Pakistan  ·  Open to projects
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.1s" fill="freeze"/>
      </text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.5s" fill="freeze"/>
        <rect x="0" y="234" width="152" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
        <circle cx="14" cy="246" r="3.6" fill="#12a17a">
          <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="250" fill="#c3cbe0" font-size="12.5" letter-spacing="0.5">Codic Systems · Founder</text>
      </g>
    </g>

    <rect y="277" width="1000" height="3" fill="#12a17a" opacity="0.85"/>
  </g>
</svg>
