<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Lal Chand, Founder of Codic Systems. Built to stand." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020933"/>
      <stop offset="50%" stop-color="#030d4e"/>
      <stop offset="100%" stop-color="#020933"/>
    </linearGradient>
    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12a17a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#12a17a"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclip"><rect width="1000" height="130" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1000" height="130" fill="url(#fbg)"/>

    <!-- slow drifting waves -->
    <g opacity="0.28">
      <path d="M0 96 Q125 76 250 96 T500 96 T750 96 T1000 96 T1250 96 V130 H0 Z" fill="#12a17a">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; -500,0" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.16">
      <path d="M0 104 Q125 122 250 104 T500 104 T750 104 T1000 104 T1250 104 V130 H0 Z" fill="#ffffff">
        <animateTransform attributeName="transform" type="translate"
          values="-500,0; 0,0" dur="19s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="300" y="0" width="400" height="2" fill="url(#frule)"/>

    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="46" fill="#ffffff" font-size="21" font-weight="600" letter-spacing="0.5">
        Built to stand.
      </text>
      <text x="500" y="70" fill="#7e8aab" font-size="12.5" letter-spacing="1.4">
        LAL CHAND · FOUNDER, CODIC SYSTEMS · ISLAMABAD
      </text>
    </g>

    <g>
      <circle cx="500" cy="88" r="3" fill="#12a17a">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
